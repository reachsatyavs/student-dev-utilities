{% extends "base.html" %}
{% block title %}Verify Code{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h2 class="mb-4">Enter the code</h2>
        <p class="text-muted">Check your email (or the server console, if mail isn't configured yet) for the 6-digit code. It expires in 10 minutes.</p>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label">6-digit code</label>
                <input type="text" class="form-control" name="otp_code" maxlength="6" pattern="\d{6}" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary">Verify</button>
        </form>
    </div>
</div>
{% endblock %}
