{% extends "base.html" %}
{% block content %}
<h1>Login</h1>
<form method="post" class="card">
  <label>Username
    <input type="text" name="username" required autofocus>
  </label>
  <label>Password
    <input type="password" name="password" required>
  </label>
  <button type="submit">Log in</button>
</form>
<p class="hint">Demo login: <code>student</code> / <code>student123</code> (created by init_db.py)</p>
{% endblock %}
