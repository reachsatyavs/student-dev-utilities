<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Send Email Demo</title>
  <style>
    body { font-family: sans-serif; max-width: 420px; margin: 60px auto; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 10px 16px; cursor: pointer; }
    #status { margin-top: 12px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Send an Email</h2>
  <form id="emailForm">
    <label for="to">To</label>
    <input type="email" id="to" name="to" required />

    <label for="subject">Subject</label>
    <input type="text" id="subject" name="subject" required />

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="5" required></textarea>

    <button type="submit">Send</button>
  </form>
  <p id="status"></p>

  <script>
    const form = document.getElementById("emailForm");
    const status = document.getElementById("status");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      status.textContent = "Sending...";

      const data = Object.fromEntries(new FormData(form));

      const res = await fetch("/send-email", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      const result = await res.json();

      status.textContent = result.message;
      if (result.success) form.reset();
    });
  </script>
</body>
</html>
